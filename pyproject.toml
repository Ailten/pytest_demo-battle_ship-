[project]
name = "bataille-naval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ailten", email = "faouzi26b@live.fr" }
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
bataille-naval = "bataille_naval.main:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5"
]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra"]
